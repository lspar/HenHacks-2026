<!DOCTYPE html>
<html>
<head>
    <title>Create An Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #BDD5EA;
        }
        .IASSO {
            font-family: 'Montserrat', sans-serif;
            font-size: 60px;
        }
        .box {
            border: 2px solid gray;     /* adds a border */
            padding: 20px;              /* space inside the box */
            width: 450px;               /* box width */
            margin: 50px auto;          /* centers box horizontally */
            border-radius: 10px;        /* optional: rounded corners */
            text-align: center;         /* centers text inside box */
            background-color: #D0DEF1;
        }
         button, .button-link {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Montserrat', sans-serif;
            border-radius: 8px;
            border: none;
            background-color: #4A6FA5;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .button-link:hover {
            background-color: #3a5a87;
        }
        .input {
            display: flex;
            flex-direction: column;
            width: 400px;
            margin: 20px auto;
            gap: 8px;
            text-align: left;
        }
        .input label {
            font-size: 16px;
            font-weight: 600;
        }
        .input input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid gray;
            font-size: 14px;
        }


</style>
    </style>
</head>
<body>


<h1 class ="IASSO">IASSO</h1>
<h2 style= "font-family: 'Montserrat'">CREATE AN ACCOUNT</h2>

<div class="box">

    <form method="POST" action="/create-account">

        <div class="input">
            <label>Username:</label>
            <input type="text" name="username" required>
        </div>

        <div class="input">
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">Create Account</button>

    </form>
</div>

</body>
</html>
