<!DOCTYPE html>
<html>
<head>
    <title>New Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #BDD5EA;
            font-family: 'Montserrat', sans-serif;
        }
        .IASSO {
            font-size: 60px;
        }
        .new-app {
            border: 2px solid gray;
            padding: 10px;
            width: 800px;
            margin: 50px auto;
            border-radius: 10px;
            text-align: center;
            background-color: #D0DEF1;
        }
        .new-title {
            font-size: 40px;
            margin-bottom: 20px;
        }
        .input {
            display: flex;
            flex-direction: column;
            width: 400px;
            margin: 20px auto;
            gap: 8px;
            text-align: left;
        }
        .input label {
            font-size: 16px;
            font-weight: 600;
        }
        .input input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid gray;
            font-size: 14px;
        }
        button, .button-link {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background-color: #4A6FA5;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .button-link:hover {
            background-color: #3a5a87;
        }
    </style>
</head>
<body>

<h1 class="IASSO">IASSO</h1>
<div class="new-app">
    <h2 class="new-title">New Application</h2>

    <p>Fill out the details below, so we can keep track of your applications!</p>

    <form action="/dashboard" method="get" class="input">
        <label for="Company_Name">Company Name:</label>
        <input type="text" id="Company_Name" name="Company_Name">

        <label for="Title">Title:</label>
        <input type="text" id="Title" name="Title">

        <label for="Recruiter_Names">Recruiter Names:</label>
        <input type="text" id="Recruiter_Names" name="Recruiter_Names">

        <button type="submit">Submit</button>
    </form>

    <a href="/dashboard" class="button-link">Back to Dashboard</a>
</div>

</body>
</html>
